name: Deploy to Oracle Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: oracle-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Oracle secrets
        id: check
        run: |
          if [ -z "${{ secrets.ORACLE_HOST }}" ] || [ -z "${{ secrets.ORACLE_SSH_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Oracle secrets not configured — use deploy/oracle/deploy.ps1 from Cursor"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      - run: npm run build
        if: steps.check.outputs.skip != 'true'

      - name: Setup SSH key
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload site files
        if: steps.check.outputs.skip != 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          USER="${ORACLE_USER:-ubuntu}"
          scp -i ~/.ssh/oracle_key -r dist/* "${USER}@${ORACLE_HOST}:/var/www/kvrhospitals/"

      - name: Upload WhatsApp server + restart
        if: steps.check.outputs.skip != 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          USER="${ORACLE_USER:-ubuntu}"
          scp -i ~/.ssh/oracle_key -r whatsapp-server/src whatsapp-server/package.json whatsapp-server/package-lock.json "${USER}@${ORACLE_HOST}:/opt/kvr-whatsapp/"
          ssh -i ~/.ssh/oracle_key "${USER}@${ORACLE_HOST}" "
            cd /opt/kvr-whatsapp && npm install --omit=dev
            if pm2 describe kvr-whatsapp >/dev/null 2>&1; then
              pm2 restart kvr-whatsapp
            else
              pm2 start src/index.js --name kvr-whatsapp
            fi
            pm2 save
            sudo chown -R ubuntu:www-data /var/www/kvrhospitals
            sudo systemctl reload nginx
          "

      - name: Summary
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "### Oracle deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Site: https://kvrhospitals.com" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://api.kvrhospitals.com/health" >> $GITHUB_STEP_SUMMARY
