# KVR Hospital — Nginx (HTTP first; Certbot adds HTTPS)
# Copy to: /etc/nginx/sites-available/kvrhospitals

# www → apex (same as sitara360.com)
server {
    listen 80;
    listen [::]:80;
    server_name www.kvrhospitals.com;
    return 301 http://kvrhospitals.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kvrhospitals.com _;

    root /var/www/kvrhospitals;
    index index.html;

    # SPA — React routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /privacy.html {
        try_files $uri =404;
    }

    location /terms.html {
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|mp4|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# WhatsApp webhook API
server {
    listen 80;
    listen [::]:80;
    server_name api.kvrhospitals.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
